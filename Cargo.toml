[package]
name = "yssv"
version = "0.1.0"
edition = "2024"

[features]
e2e = []

[dependencies]
eframe        = { version = "0.34.3", default-features = false, features = ["glow", "wgpu", "default_fonts", "accesskit", "persistence"] }
egui          = "0.34.3"
egui_extras   = { version = "0.34.3", features = ["svg"] }
tokio         = { version = "1", features = ["full"] }
rusqlite      = { version = "0.40.1", features = ["bundled"] }
sqlx          = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
uuid          = { version = "1.23.3", features = ["v4"] }
rfd               = "0.17.2"
async-trait       = "0.1"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender  = "0.2"
keyring           = "4.0.1"
keyring-core      = "1.0.0"
russh = { version = "0.61.2", default-features = false, features = ["flate2", "ring", "rsa"] }

[dev-dependencies]
tokio                  = { version = "1", features = ["full", "test-util"] }
tempfile               = "3"
egui                   = "0.34.3"
egui_extras            = { version = "0.34.3", features = ["svg"] }
egui_kittest           = "0.34.3"
testcontainers         = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql"] }

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

