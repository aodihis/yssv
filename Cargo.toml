[package]
name = "yssv"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe        = { version = "0.34.3", features = ["default", "glow", "wgpu"] }
egui          = "0.34.3"
egui_extras   = { version = "0.34.3" }
tokio         = { version = "1", features = ["full"] }
rusqlite      = { version = "0.31", features = ["bundled"] }
sqlx          = { version = "0.9.0", features = ["runtime-tokio-rustls", "postgres", "mysql"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
uuid          = { version = "1", features = ["v4"] }
async-trait       = "0.1"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender  = "0.2"

[dev-dependencies]
tokio         = { version = "1", features = ["full", "test-util"] }
tempfile      = "3"
