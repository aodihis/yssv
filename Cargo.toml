[package]
name = "yssv"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe        = { version = "0.34.3", default-features = false, features = ["glow", "wgpu", "default_fonts", "accesskit", "persistence"] }
egui          = "0.34.3"
egui_extras   = { version = "0.34.3", features = ["svg"] }
tokio         = { version = "1", features = ["full"] }
rusqlite      = { version = "0.40.1", features = ["bundled"] }
sqlx          = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
uuid          = { version = "1.23.3", features = ["v4"] }
rfd               = "0.17.2"
async-trait       = "0.1"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender  = "0.2"
keyring           = "4.0.1"
keyring-core      = "1.0.0"

[dev-dependencies]
tokio         = { version = "1", features = ["full", "test-util"] }
tempfile      = "3"
egui_kittest  = "0.34.3"

